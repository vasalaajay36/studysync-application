spring.application.name=studysync

# Production database settings must be provided by the hosting provider.
# No machine-specific database host or credentials are hard-coded here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Render and other hosts provide PORT at runtime.
server.port=${PORT:8080}
server.address=0.0.0.0

# HTTPS session-cookie defaults for production hosting.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.name=STUDYSYNC_SESSION
server.forward-headers-strategy=framework
