spring.application.name=studysync

# MySQL database settings (Aiven MySQL via DB_URL env var)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studysync_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Render supplies PORT at runtime.
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Session cookie hardening
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.name=STUDYSYNC_SESSION

# CORS allowed origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
